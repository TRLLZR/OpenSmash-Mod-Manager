name: Publish Windows release
on:
  create:
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'TRLLZR/OpenSmash-Mod-Manager' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v')
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: windows-release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Verify the release branch
        env:
          RELEASE_BRANCH: ${{ github.event.ref }}
        run: |
          $version = (Get-Content publication_inventory.json -Raw | ConvertFrom-Json).version
          if ($version -notmatch '\A[0-9]+\.[0-9]+\.[0-9]+\z' -or $env:RELEASE_BRANCH -cne "release/v$version") {
            throw 'Release branch must match the source version.'
          }
          $main = git ls-remote origin refs/heads/main
          if ($LASTEXITCODE -ne 0 -or (($main -split '\s+')[0] -ne $env:GITHUB_SHA)) {
            throw 'The release branch must point to the current main commit.'
          }
      - name: Audit and build
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          python audit_publication.py
          python -m unittest test_publication
          python prepare_runtime.py
          installer/runtime/python.exe -B build_release.py
          python export_source.py
      - name: Publish verified installer and source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content publication_inventory.json -Raw | ConvertFrom-Json).version
          $tag = "v$version"
          $setup = "OpenSmash_Mod_Manager_Setup_$tag.exe"
          $installer = "OpenSmash_Mod_Manager_Installer_$tag.zip"
          $source = "OpenSmash_Mod_Manager_Source_$tag.zip"
          Copy-Item -LiteralPath "release-$version/Setup.exe" -Destination $setup
          $assets = @($setup, $installer, "$installer.sha256", $source, "$source.sha256")
          @'
          Guided Windows setup for OpenSmash Mod Manager. Download and run the Setup executable,
          then select your OpenSmash folder and follow the prompts.

          Installed copies with automatic updates use the installer ZIP from this release.
          The source ZIP includes the corresponding 7-Zip source and license notices.
          '@ | Set-Content -LiteralPath release-notes.md -Encoding utf8

          gh release create $tag @assets --draft --target $env:GITHUB_SHA --title "OpenSmash Mod Manager $tag" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Could not create and upload the draft release.' }
          $id = gh release view $tag --json databaseId --jq '.databaseId'
          if ($LASTEXITCODE -ne 0 -or $id -notmatch '\A[0-9]+\z') { throw 'Could not find the draft release.' }
          $release = gh api "repos/$env:GITHUB_REPOSITORY/releases/$id" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !$release.draft -or $release.target_commitish -ne $env:GITHUB_SHA) {
            throw 'Unexpected draft release target.'
          }
          foreach ($name in $assets) {
            $asset = $release.assets | Where-Object { $_.name -ceq $name -and $_.state -eq 'uploaded' }
            $digest = (Get-FileHash -LiteralPath $name -Algorithm SHA256).Hash.ToLowerInvariant()
            if (!$asset -or $asset.digest -cne "sha256:$digest") { throw "Unexpected asset digest for $name." }
          }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Could not publish the verified release.' }
