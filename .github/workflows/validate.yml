name: Validate source
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-backend:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check publication inventory and notices
        run: python audit_publication.py
      - name: Check publication guards
        run: python -m unittest test_publication
      - name: Prepare SHA-256-pinned private runtime
        run: python prepare_runtime.py
      - name: Build native host
        shell: powershell
        run: .\installer\BuildLauncher.ps1
      - name: Run synthetic backend suite
        run: installer/runtime/python.exe -B -m unittest discover -s installer -p 'test_*.py'
      - name: Build installer payload
        run: installer/runtime/python.exe -B build_release.py
