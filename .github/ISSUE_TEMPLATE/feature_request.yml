name: Feature request
description: Suggest a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What task is difficult today?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Proposed behavior
      description: Describe a workflow or mod structure rather than hardcoding a specific mod title.
    validations:
      required: true
